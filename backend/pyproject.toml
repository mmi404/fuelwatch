[project]
name = "fuelwatch"
version = "0.1.0"
description = "FuelWatch backend: ingest, snapshot, intelligence and execution over the BUP Fuel Supply Simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fuelwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
