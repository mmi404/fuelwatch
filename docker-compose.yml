# FuelWatch stack. `docker compose up -d --build` starts the simulator, the backend, the operator console (:3000),
# Prometheus and Grafana.
# Profiles: `discord` posts alerts to a Discord channel, `bench` adds a second simulator on :8001 for the replay benchmark, `loadtest` runs k6.
# A service that exits on its own is started again; `docker compose stop` or `down` keeps it stopped.
# Host ports can be moved with the *_PORT variables in .env (useful when something else already uses 8000).

services:
  simulator:
    restart: unless-stopped
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-1}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${SIMULATOR_PORT:-8000}:8000"

  simulator-bench:
    profiles: ["bench"]
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-1}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: paused
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BENCH_SIMULATOR_PORT:-8001}:8000"

  backend:
    restart: unless-stopped
    build: ./backend
    environment:
      SIMULATOR_URL: http://simulator:8000
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-demo-token}
      ACCOUNTS: ${ACCOUNTS:-}
      ALLOCATOR: ${ALLOCATOR:-lp}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-3}
      POLL_INTERVAL: ${POLL_INTERVAL:-0.5}
      REFRESH_MAX_AGE: ${REFRESH_MAX_AGE:-5}
      READY_MAX_AGE: ${READY_MAX_AGE:-15}
      SHED_OPTIONAL_LIMIT: ${SHED_OPTIONAL_LIMIT:-128}
      SHED_ESSENTIAL_LIMIT: ${SHED_ESSENTIAL_LIMIT:-256}
      SHED_STREAM_LIMIT: ${SHED_STREAM_LIMIT:-200}
    volumes:
      - backend-data:/data
    depends_on:
      - simulator
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8080}:8080"

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
        # Empty by default: the operator types the token into the console. A value here is shipped to every browser
        # that opens the page, so anyone who can reach it could approve shipments.
        PREFILL_TOKEN: ${DASHBOARD_PREFILL_TOKEN:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck: # lets `up --wait` return only once the page answers
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-3001}:3000"
    healthcheck: # lets `up --wait` return only once the page answers
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  # Posts Prometheus alerts to Discord. Off unless the `discord` profile is on: see "Alerts in Discord" in the README.
  alertmanager:
    profiles: ["discord"]
    restart: unless-stopped
    image: prom/alertmanager:v0.27.0
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$DISCORD_WEBHOOK_URL" ] || { echo "Set DISCORD_WEBHOOK_URL in .env" >&2; exit 1; }
        umask 077
        printf %s "$$DISCORD_WEBHOOK_URL" > /tmp/discord_webhook
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/tmp/alertmanager
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093" # no sign-in of its own, so this PC only
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  k6:
    profiles: ["loadtest"]
    image: grafana/k6:0.54.0
    environment:
      TARGET: http://backend:8080
    volumes:
      - ./loadtest:/scripts:ro
    entrypoint: ["k6"]
    command: ["run", "/scripts/dashboard.js"]
    depends_on:
      - backend

volumes:
  backend-data:
  prometheus-data:
  grafana-data:
