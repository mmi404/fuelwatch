# Checks the backend, the console and the monitoring config, then starts the whole Compose stack and probes it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # as in backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/constraints.txt

      - name: Install
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  console:
    name: Console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # as in frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # If this fails, run `npm run bench:data` in frontend/ and commit data/bench.json.
      - name: Results page data matches the saved benchmark runs
        run: |
          npm run bench:data
          git diff --exit-code -- data/bench.json

      - name: Build
        run: npm run build

  monitoring:
    name: Monitoring config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v2.55.1 # keep the same as in docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      # The folder is mounted at /etc/prometheus because prometheus.yml loads /etc/prometheus/alerts.yml.
      - name: Check the Prometheus config
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml

      - name: Test the alert rules
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool \
            "$PROMETHEUS_IMAGE" test rules alerts.test.yml

      - name: Check the Alertmanager config
        run: |
          docker run --rm -v "$PWD/ops/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Grafana dashboards are valid JSON
        run: |
          for file in ops/grafana/dashboards/*.json; do
            echo "Parsing $file"
            python3 -m json.tool "$file" > /dev/null
          done

  smoke:
    name: Stack smoke test
    needs: [backend, console, monitoring]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the Compose file
        run: docker compose config -q

      # Waits until services with a health check are healthy and the others are running.
      # No .env file is needed. The simulator starts paused and these checks do not need it to run.
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Backend is alive and ready
        run: |
          for path in livez readyz; do
            echo "GET /$path"
            curl --fail --silent --show-error --output /dev/null --max-time 5 \
              --retry 30 --retry-delay 2 --retry-all-errors "http://localhost:8080/$path"
          done

      - name: Console page is served
        run: |
          curl --fail --silent --show-error --output /dev/null --max-time 5 \
            --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3000/

      - name: Console reaches the backend and the mode is LIVE
        run: |
          for attempt in $(seq 1 45); do
            body=$(curl --fail --silent --max-time 5 http://localhost:3000/api/status || true)
            if [ "$(echo "$body" | jq -r '.mode')" = "LIVE" ]; then
              echo "$body" | jq '{mode, tick}'
              exit 0
            fi
            sleep 2
          done
          echo "The mode did not become LIVE. Last response: $body"
          exit 1

      - name: Prometheus has loaded the alert rules
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl --fail --silent --max-time 5 http://localhost:9090/api/v1/rules || true)
            if [ "$(echo "$body" | jq 'any(.data.groups[]?; .name == "fuelwatch" and (.rules | length) > 0)')" = "true" ]; then
              echo "$body" | jq -r '.data.groups[] | "\(.name): \(.rules | length) rules"'
              exit 0
            fi
            sleep 2
          done
          echo "The fuelwatch rule group is not loaded. Last response: $body"
          exit 1

      # cancelled() covers a run that hit the job time limit.
      - name: Show logs
        if: failure() || cancelled()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down -v
